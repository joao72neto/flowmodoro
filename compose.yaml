version: "3.8"
services:

  front:
    build:
      context: ./frontend
    depends_on:
      - back
    ports:
      - "3000:80"

  back:
    build:
      context: ./backend
    ports:
      - "8080:8080"
    depends_on:
      - db

  db:
    image: postgres:17
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123
      POSTGRES_DB: flowmodoro