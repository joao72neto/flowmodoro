version: "3.8"
services:

  front:
    image: node:22
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "3000:5173"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - back
      
  back:
    image: maven:3.9-eclipse-temurin-21
    working_dir: /app
    ports:
      - "8080:8080"
    volumes:
      - ./backend:/app
    command: mvn spring-boot:run
    depends_on:
      - db

  db:
    image: postgres:17
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123
      POSTGRES_DB: flowmodoro